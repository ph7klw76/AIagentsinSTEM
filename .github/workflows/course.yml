name: Course checks and Pages
on:
  push:
    branches: [main, feature/integrated-h5p-course]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-course.lock.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements-course.lock.txt
      - name: Publication exclusions
        run: node scripts/publication-check.mjs
      - name: Canonical scientific model and actual desktop notebook
        run: python scripts/execute-notebook.py
      - name: Native H5P and Lumi HTML
        run: npm run build
      - run: npm test
      - name: Import every native H5P package through Lumi
        run: node scripts/import-h5p.mjs
      - name: Build indexed JupyterLite with Pyodide
        run: python -m jupyterlite_core.app build --contents content/lab --output-dir dist/lite
      - name: Hash exact public resources
        run: node scripts/finalize-build.mjs
      - name: Install isolated browser and fixture encoder
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Synthetic native CI fixtures (never published)
        run: |
          python scripts/ci-fixtures.py
          node scripts/build.mjs --local-preview
      - name: Desktop and phone player, startup, practice and actual browser notebook
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: course-site-${{ github.sha }}
          path: dist/
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v5
